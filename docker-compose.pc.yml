# Панель и локальные нейронки на домашнем ПК, вход с ноутбука по сети.
#
# Linux:
#   HH_PANEL_PUBLIC_HOSTS=192.168.0.104 docker compose -f docker-compose.pc.yml up -d --build
# Windows с Docker Desktop: scripts\windows\setup-docker.ps1 один раз,
# дальше scripts\windows\hh-panel.ps1 start | stop | status | logs.
#
# Откройте на ноутбуке https://<IP ПК>:8090. Токен для входа лежит в
# <папка конфига>/panel-token.txt и печатается в логе панели.
#
# Видеокарта NVIDIA: NVIDIA Container Toolkit (Linux) или Docker Desktop с
# WSL2 (Windows). Без видеокарты уберите блок deploy у ollama: модели поедут
# на процессоре, медленно, но работать будут.
#
# Настройки берутся из окружения или файла --env-file:
#   HH_CONFIG_PATH          папка конфига на хосте (по умолчанию ./config)
#   HH_PANEL_PORT           порт на хосте (8090)
#   HH_PANEL_PUBLIC_HOSTS   IP ПК в сети через запятую: попадут в сертификат
#   TZ                      часовой пояс для расписания (Europe/Moscow)
name: hh

services:
  panel:
    build: .
    image: hh-applicant-tool:latest
    container_name: hh-panel
    command: ["panel", "--host", "0.0.0.0", "--port", "8090"]
    ports:
      # Порт открыт в сеть: панель сама включает HTTPS и токен
      - "${HH_PANEL_PORT:-8090}:8090"
    volumes:
      - ${HH_CONFIG_PATH:-./config}:/config
    environment:
      - CONFIG_DIR=/config
      - OLLAMA_URL=http://ollama:11434
      - HH_PANEL_PUBLIC_HOSTS=${HH_PANEL_PUBLIC_HOSTS:-}
      - HH_PANEL_PUBLIC_PORT=${HH_PANEL_PORT:-8090}
      - TZ=${TZ:-Europe/Moscow}
      # - HH_PANEL_TOKEN=свой-длинный-токен
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: hh-ollama
    volumes:
      # Модели весят гигабайты: отдельный том, быстрее папки с хоста
      - ollama:/root/.ollama
    environment:
      # Держать модель в видеопамяти 30 минут после запроса
      - OLLAMA_KEEP_ALIVE=30m
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    # Наружу не публикуем: панель и утилита ходят в ollama по имени сервиса

volumes:
  ollama:
